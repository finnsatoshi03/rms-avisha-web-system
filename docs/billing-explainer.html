<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing in RMS Avisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #F02A24;        /* brand red (from src/styles/index.css --brand) */
    --red-deep: #C5211B;
    --red-soft: #FEECEB;
    --ink: #1F2328;
    --muted: #6B7280;
    --line: #E5E7EB;
    --soft: #F7F8FA;
    --green: #16A34A;
    --green-ink: #166534;
    --green-soft: #DCFCE7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EEF0F3; color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  b { font-weight: 700; }
  .muted { color: var(--muted); }
  .red { color: var(--red); }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex: none; }

  /* ---------- Stage (fixed 1280x720, scaled to fit) ---------- */
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #fff; overflow: hidden;
    transform-origin: 0 0; box-shadow: 0 8px 40px rgba(16,24,40,.10); }
  #scene { position: absolute; inset: 0; transition: opacity .4s ease; }
  #stage.paused, #stage.paused * { animation-play-state: paused !important; }

  /* ---------- Captions ---------- */
  #cap { position: absolute; left: 50%; bottom: 24px; z-index: 60; width: max-content; max-width: 1120px;
    padding: 14px 30px; border-radius: 18px; background: rgba(31,35,40,.88); color: #fff;
    font-size: 30px; font-weight: 600; line-height: 1.32; text-align: center; white-space: pre-line;
    animation: capIn .5s ease-out both; }
  @keyframes capIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- Cursor, click ripple, highlight ring ---------- */
  #cursor { position: absolute; left: 0; top: 0; margin: -2px 0 0 -5px; z-index: 55; opacity: 0; pointer-events: none;
    transition: transform .65s cubic-bezier(.45,0,.25,1), opacity .3s; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  #cursor.on { opacity: 1; }
  #cursor svg { display: block; transform-origin: 5px 2px; }
  #cursor.press svg { animation: press .35s ease; }
  @keyframes press { 50% { transform: scale(.8); } }
  .ripple { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    border: 3px solid var(--red); z-index: 54; pointer-events: none; animation: rip .6s ease-out forwards; }
  @keyframes rip { from { transform: scale(.2); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
  .ring { position: absolute; z-index: 40; border-radius: 14px; border: 3px solid var(--red); pointer-events: none;
    animation: ringIn .4s ease-out, pulse 1.6s .4s ease-in-out infinite; }
  @keyframes ringIn { from { opacity: 0; transform: scale(1.04); } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240,42,36,.35); } 50% { box-shadow: 0 0 0 10px rgba(240,42,36,0); } }
  .tap { animation: tap .3s ease; }
  @keyframes tap { 50% { transform: scale(.95); } }
  tr.tap td { animation: rowTap .6s ease; }
  @keyframes rowTap { 30% { background: var(--red-soft); } }

  /* ---------- App frame ---------- */
  .app { position: absolute; left: 80px; top: 24px; width: 1120px; height: 548px; background: #fff; overflow: hidden;
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 40px rgba(16,24,40,.08); }
  .topbar { height: 45px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line);
    font-weight: 700; font-size: 14px; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--red); }
  .crumb { color: var(--muted); font-weight: 500; }
  .page { padding: 22px 28px; transition: opacity .5s; }
  .page > * { transition: opacity .5s; }
  .app.dim .page { opacity: .3; }
  .app.fc .toolbar, .app.fa table { opacity: .3; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px; letter-spacing: -.01em; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
  .search { width: 340px; height: 38px; border: 1px solid var(--line); border-radius: 9px; display: flex; align-items: center;
    gap: 8px; padding: 0 12px; color: #9CA3AF; font-size: 14px; }
  .filter { height: 38px; border: 1px solid var(--line); border-radius: 9px; padding: 0 14px; display: flex; align-items: center; font-size: 14px; font-weight: 500; }
  .btn-red { background: var(--red); color: #fff; border-radius: 9px; height: 38px; padding: 0 16px; font-weight: 600; font-size: 14px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn-out { background: #fff; border: 1px solid var(--line); border-radius: 9px; height: 38px; padding: 0 14px; font-weight: 600; font-size: 14px;
    display: inline-flex; align-items: center; white-space: nowrap; }
  .btn-ghost { height: 38px; padding: 0 14px; font-weight: 600; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; }
  .toolbar .btn-red { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--line); }
  td { padding: 14px; border-bottom: 1px solid var(--line); }
  .pill-green { background: var(--green-soft); color: var(--green-ink); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  tr.newrow { display: none; }
  .app.added tr.newrow { display: table-row; }
  .app.added tr.newrow td { animation: rowIn 1.6s ease; }
  @keyframes rowIn { 0% { opacity: 0; background: #F0FDF4; } 30% { opacity: 1; background: #F0FDF4; } }

  /* ---------- Client account panel ---------- */
  .panel { position: absolute; top: 45px; right: 0; bottom: 0; width: 600px; z-index: 5; background: #fff; padding: 22px 28px;
    border-left: 1px solid var(--line); box-shadow: -24px 0 48px rgba(16,24,40,.10);
    transform: translateX(105%); transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  .panel.in { transform: none; }
  .panel > * { transition: opacity .5s; }
  .panel.quiet .tabs, .panel.quiet .tabbody,
  .panel.f-owes .actions, .panel.f-owes .tabs, .panel.f-owes .tabbody,
  .panel.f-tabs .owes-box, .panel.f-tabs .actions { opacity: .3; }
  .p-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .p-acc { font-size: 13px; color: var(--muted); }
  .p-name { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .kebab { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; color: var(--muted); }
  .owes-box { position: relative; margin: 16px 0; padding: 16px 18px; border-radius: 14px; background: var(--soft); }
  .owes-box .lbl { font-size: 14px; color: var(--muted); font-weight: 500; }
  .big { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .over { color: var(--red); font-weight: 600; font-size: 15px; margin-top: 4px; }
  .over.clear { color: var(--green); }
  .paid { position: absolute; right: 18px; top: 18px; background: var(--green-soft); color: var(--green-ink); font-weight: 700; font-size: 15px;
    padding: 8px 14px; border-radius: 999px; opacity: 0; transform: scale(.7); transition: opacity .4s, transform .5s cubic-bezier(.3,1.6,.5,1); }
  .paid.show { opacity: 1; transform: none; }
  .flash-up { animation: flUp 1.8s ease; }
  .flash-down { animation: flDown 1.8s ease; }
  @keyframes flUp { 20%, 70% { color: var(--red-deep); } }
  @keyframes flDown { 20%, 70% { color: var(--green); } }
  .actions { display: flex; gap: 10px; }
  .tabs { display: flex; gap: 24px; margin-top: 20px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--muted); }
  .tab { padding: 10px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; transition: color .3s, border-color .3s; }
  .tab.on { color: var(--ink); border-color: var(--red); font-weight: 600; }
  .tabbody.swap { animation: fadeUp .45s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
  .hrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hrow .d { width: 52px; color: var(--muted); font-size: 13px; }
  .hrow .t { flex: 1; }
  .hrow .a { font-weight: 700; }
  .hrow .a.paid-amt { color: var(--green); }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .tag.overdue { background: var(--red-soft); color: var(--red-deep); }
  .tag.paid { background: var(--green-soft); color: var(--green-ink); }
  .tag.sent { background: #F3F4F6; color: var(--muted); }

  /* ---------- Dialogs ---------- */
  .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(17,24,39,.28); opacity: 0; transition: opacity .4s; }
  .scrim.in { opacity: 1; }
  .dlg { position: absolute; left: 50%; top: 50%; z-index: 21; width: 460px; padding: 22px 24px; background: #fff; border-radius: 16px;
    box-shadow: 0 24px 60px rgba(16,24,40,.25); opacity: 0; transform: translate(-50%, -46%);
    transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); }
  .dlg.in { opacity: 1; transform: translate(-50%, -50%); }
  .dlg.out { opacity: 0; transform: translate(-50%, -50%) scale(.96); }
  .dlg.sent { opacity: 0; transform: translate(-20%, -90%) scale(.3); transition: opacity .6s, transform .7s ease-in; }
  .dlg h3 { margin: 0 0 14px; font-size: 19px; }
  .dlg label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .field { height: 42px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 0 12px; font-size: 15px; transition: background .4s, border-color .4s; }
  .field .ph { color: #9CA3AF; }
  .field .val { display: none; font-weight: 600; }
  .field.filled .ph { display: none; }
  .field.filled .val { display: inline; }
  .ok { color: var(--green); font-weight: 700; opacity: 0; transition: opacity .3s; }
  .filled .ok { opacity: 1; }
  .caret { color: var(--muted); margin-left: auto; }
  .selwrap { position: relative; }
  .menu { position: absolute; left: 0; right: 0; top: 46px; z-index: 3; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 30px rgba(16,24,40,.14); opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; }
  .menu.in { opacity: 1; transform: none; }
  .mi { padding: 9px 10px; border-radius: 7px; font-size: 14px; transition: background .2s; }
  .mi.hov { background: var(--soft); font-weight: 600; }
  .autofill { opacity: .4; transition: opacity .5s; }
  .autofill.filled { opacity: 1; }
  .autofill .field.filled { background: #F0FDF4; border-color: #BBF7D0; }
  .dlg-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 20px; }
  .seltot { margin-right: auto; font-size: 14px; color: var(--muted); }
  .seltot b { color: var(--ink); font-size: 16px; }
  .seg { display: inline-flex; padding: 4px; background: var(--soft); border-radius: 10px; font-size: 14px; font-weight: 600; }
  .seg span { padding: 7px 16px; border-radius: 7px; color: var(--muted); }
  .seg .on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hint { font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .pick { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px;
    transition: background .3s, border-color .3s; }
  .pick.on { background: var(--red-soft); border-color: #FBC7C4; }
  .pick .sub { color: var(--muted); }
  .pick .amt { margin-left: auto; font-weight: 700; }
  .cb { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #CBD5E1; display: grid; place-items: center; color: #fff; font-size: 12px; transition: .25s; }
  .cb::after { content: "✓"; opacity: 0; }
  .pick.on .cb { background: var(--red); border-color: var(--red); }
  .pick.on .cb::after { opacity: 1; }
  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; height: 40px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-weight: 600; font-size: 14px; transition: .3s; }
  .chip.on { border-color: var(--red); background: var(--red-soft); color: var(--red-deep); }
  .drop { height: 74px; border: 2px dashed #D1D5DB; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--muted);
    font-size: 14px; transition: background .4s, border-color .4s; }
  .drop .ph { display: flex; align-items: center; gap: 8px; }
  .drop .thumb { display: none; align-items: center; gap: 12px; font-size: 14px; color: var(--ink); }
  .drop.filled { border-style: solid; border-color: #BBF7D0; background: #F0FDF4; justify-content: flex-start; padding: 0 12px; }
  .drop.filled .ph { display: none; }
  .drop.filled .thumb { display: flex; animation: fadeUp .4s ease; }
  .thumbimg { width: 44px; height: 52px; border-radius: 6px; border: 1px solid var(--line); background: repeating-linear-gradient(#fff 0 6px, #E5E7EB 6px 8px); }
  .dates { display: flex; gap: 12px; }
  .dates > div { flex: 1; }
  .auto { font-size: 11px; font-weight: 700; color: var(--green-ink); background: var(--green-soft); padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .sumbox { margin-top: 16px; padding: 14px 16px; background: var(--soft); border-radius: 12px; display: flex; justify-content: space-between; font-size: 15px; }
  .mail { width: 580px; padding: 0; overflow: hidden; }
  .mail-top { display: flex; justify-content: space-between; padding: 12px 18px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mrow .k { width: 60px; color: var(--muted); }
  .to-chip { padding: 4px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-weight: 600; }
  .mbody { padding: 14px 18px 0; font-size: 14px; line-height: 1.6; color: #374151; }
  .attach { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .mail .dlg-foot { padding: 0 18px 16px; margin-top: 14px; }
  .plane { position: absolute; z-index: 45; width: 46px; height: 46px; color: var(--red); animation: fly 1.5s cubic-bezier(.4,0,.6,1) forwards; }
  .plane svg { width: 100%; height: 100%; stroke-width: 1.8; }
  @keyframes fly { 0% { transform: translate(0,0) scale(.5); opacity: 0; } 15% { opacity: 1; }
    50% { transform: translate(160px,-120px) rotate(-6deg) scale(1); } 100% { transform: translate(420px,-400px) rotate(-14deg) scale(.7); opacity: 0; } }
  .toast { position: absolute; left: 50%; top: 62px; z-index: 30; padding: 10px 18px; border-radius: 999px; background: #fff; border: 1px solid #BBF7D0;
    color: var(--green-ink); font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px rgba(16,24,40,.12);
    opacity: 0; transform: translate(-50%, -10px); transition: opacity .4s, transform .4s; }
  .toast.in { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Scene 1: hook ---------- */
  .hook { position: absolute; inset: 0; }
  .card { position: absolute; top: 70px; z-index: 2; width: 250px; padding: 16px 18px; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(16,24,40,.10); opacity: 0; transition: transform 1s cubic-bezier(.5,0,.3,1), opacity .8s; }
  .card .kind { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .card .no { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card .what { font-size: 18px; font-weight: 700; margin-top: 8px; }
  .card .amt { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .unpaid { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red-deep); font-size: 12px; font-weight: 600; }
  .c1 { left: 250px; transform: translateX(-80px); }
  .c2 { left: 780px; transform: translateX(80px); }
  .hook.s1 .card { opacity: 1; transform: none; }
  .hook.s2 .c1 { opacity: 0; transform: translate(265px, 250px) scale(.35); }
  .hook.s2 .c2 { opacity: 0; transform: translate(-265px, 250px) scale(.35); }
  .folder { position: absolute; left: 510px; top: 330px; width: 260px; height: 180px; }
  .f-back { position: absolute; inset: 0; z-index: 1; background: #F9C9C6; border-radius: 6px 14px 14px 14px; }
  .f-back::before { content: ""; position: absolute; left: 0; top: -22px; width: 110px; height: 26px; background: #F9C9C6; border-radius: 10px 10px 0 0; }
  .f-front { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 3; padding: 16px 18px; border-radius: 14px; background: var(--red); color: #fff;
    display: flex; flex-direction: column; justify-content: flex-end; transform-origin: bottom; }
  .f-name { font-size: 17px; font-weight: 700; }
  .f-count { font-size: 14px; margin-top: 4px; opacity: 0; transition: opacity .4s; }
  .hook.s3 .f-count { opacity: .95; }
  .hook.s3 .f-front { animation: bump .5s ease; }
  @keyframes bump { 50% { transform: scaleY(.93); } }

  /* ---------- Scene 9: recap ---------- */
  .recap-title { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
  .recap { position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center; align-items: flex-start; gap: 28px; }
  .rstep { width: 240px; text-align: center; opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
  .rstep.show { opacity: 1; transform: none; }
  .ric { width: 136px; height: 136px; margin: 0 auto 18px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; }
  .ric .ic { width: 60px; height: 60px; }
  .rnum { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .rlabel { font-size: 26px; font-weight: 700; }
  .rarrow { margin-top: 48px; font-size: 40px; color: #CBD5E1; opacity: 0; transition: opacity .5s; }
  .rarrow.show { opacity: 1; }
  .recap.done .ric { animation: pulse 1.8s ease-in-out infinite; }

  /* ---------- Controls ---------- */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: #fff; border-top: 1px solid var(--line); }
  #prog { position: absolute; left: 0; top: -1px; height: 3px; width: 0; background: var(--red); }
  #bar button { border: 0; cursor: pointer; font: inherit; color: var(--ink); }
  .ctl { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; }
  .ctl:hover { background: #EDEFF2; }
  .ctl svg { width: 18px; height: 18px; }
  #dots { flex: 1; display: flex; justify-content: center; gap: 10px; }
  .dot { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #D1D5DB !important; transition: transform .2s, background .2s; }
  .dot.done { background: #9CA3AF !important; }
  .dot.on { background: var(--red) !important; transform: scale(1.3); }
  .dot:hover { transform: scale(1.3); }
  #lbl { min-width: 200px; text-align: right; font-size: 14px; color: var(--muted); font-weight: 500; }
  @media (max-width: 640px) { #lbl { display: none; } #dots { gap: 6px; } }
</style>
</head>
<body>

<div id="stage">
  <div id="scene"></div>
  <div id="cursor"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 2l16 9.5-7 1.5-3.5 6.5z" fill="#1F2328" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
  <div id="cap"></div>
</div>

<div id="bar">
  <div id="prog"></div>
  <button class="ctl" id="b-play" aria-label="Play or pause"></button>
  <button class="ctl" id="b-restart" aria-label="Restart"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <div id="dots"></div>
  <div id="lbl"></div>
</div>

<script>
/* =====================================================================
   CAPTIONS — all teaching text lives here. Translate freely.
   "\n" = line break (keep captions to 2 short lines).
   ===================================================================== */
const CAPTIONS = {
  hook:     "Some clients pay later.\nBilling keeps track of what they owe, all in one place.",
  find:     "Every client with an account is here.\nSee who owes, and who's overdue.",
  add:      "No account yet? Click Add,\npick the client, and save. That's it.",
  open:     "Click a client to see how much they owe.",
  charges:  "Finished a job but the client will pay later?\nAdd it to their account.",
  payment:  "Client paid? Record it and attach the receipt.\nThe balance updates automatically.",
  send1:    "Send the client a statement:\na summary of what they owe.",

const stage = document.getElementById("stage");
const S = document.getElementById("scene");
const CUR = document.getElementById("cursor");
const CAP = document.getElementById("cap");

const peso = n => "₱" + n.toLocaleString("en-PH");
const $ = s => S.querySelector(s);
const all = s => S.querySelectorAll(s);
const add = (s, c = "in") => all(s).forEach(e => e.classList.add(c));
const rm = (s, c = "in") => all(s).forEach(e => e.classList.remove(c));
const restart = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };

function cap(key) { CAP.textContent = CAPTIONS[key]; CAP.style.animation = "none"; void CAP.offsetWidth; CAP.style.animation = ""; }

// Union rectangle of everything matching `sel`, in stage pixels.
function box(sel) {
  const sr = stage.getBoundingClientRect(), k = sr.width / 1280;
  let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  all(sel).forEach(e => {
    const q = e.getBoundingClientRect();
    if (!q.width) return;
    l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
  });
  return { x: (l - sr.left) / k, y: (t - sr.top) / k, w: (r - l) / k, h: (b - t) / k };
}

let cx = 900, cy = 640;
function point(sel, fx = .5, fy = .5) {
  const b = box(sel);
  cx = b.x + b.w * fx; cy = b.y + b.h * fy;
  CUR.style.transform = `translate(${cx}px,${cy}px)`;
  CUR.classList.add("on");
}
function click(sel) {
  restart(CUR, "press");
  const r = document.createElement("div");
  r.className = "ripple"; r.style.left = cx + "px"; r.style.top = cy + "px";
  S.appendChild(r);
  if (sel) all(sel).forEach(e => restart(e, "tap"));
}
function ring(sel) {
  unring();
  const b = box(sel), r = document.createElement("div");
  r.className = "ring";
  Object.assign(r.style, { left: b.x - 8 + "px", top: b.y - 8 + "px", width: b.w + 16 + "px", height: b.h + 16 + "px" });
  S.appendChild(r);
}
function unring() { all(".ring").forEach(r => r.remove()); }

// Number tween driven by the scene clock (so it respects pause).
let tweens = [];
function count(sel, from, to, dur) {
  const el = $(sel), s = t;
  tweens.push(() => {
    const p = Math.min(1, (t - s) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = peso(Math.round(from + (to - from) * e));
    return p < 1;
  });
}

function plane() {
  const b = box("#b-send"), p = document.createElement("div");
  p.className = "plane"; p.innerHTML = ICON.send;
  p.style.left = b.x + b.w / 2 - 23 + "px"; p.style.top = b.y - 16 + "px";
  S.appendChild(p);
}

function setTab(name) {
  rm(".tab", "on"); add(`[data-t=${name}]`, "on");
  const body = $("#tabbody");
  body.innerHTML = rows(HIST[name]);
  restart(body, "swap");
}

/* =====================================================================
   Player engine
   ===================================================================== */
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const startOf = i => SCENES.slice(0, i).reduce((a, s) => a + s.dur, 0);
let idx = 0, t = 0, pi = 0, playing = true, last = 0;

const playBtn = document.getElementById("b-play");
const dots = document.getElementById("dots");
const lbl = document.getElementById("lbl");
const prog = document.getElementById("prog");

SCENES.forEach((_, i) => {
  const d = document.createElement("button");
  d.className = "dot"; d.title = `${i + 1}. ${CAPTIONS.steps[i]}`; d.setAttribute("aria-label", d.title);
  d.onclick = () => { goto(i); setPlaying(true); };
  dots.appendChild(d);
});

function goto(i) {
  idx = i; t = 0; pi = 0; tweens = [];
  CUR.classList.remove("on");
  S.style.transition = "none"; S.style.opacity = 0;
  SCENES[i].build();
  void S.offsetWidth;
  S.style.transition = ""; S.style.opacity = 1;
  [...dots.children].forEach((d, j) => { d.classList.toggle("on", j === i); d.classList.toggle("done", j < i); });
  lbl.textContent = `${i + 1} / ${SCENES.length} · ${CAPTIONS.steps[i]}`;
}

function setPlaying(v) {
  if (v && idx === SCENES.length - 1 && t >= SCENES[idx].dur) goto(0); // replay from the end
  playing = v;
  stage.classList.toggle("paused", !v);
  playBtn.innerHTML = v ? ICON.pause : ICON.play;
}

function tick(now) {
  const dt = Math.min(100, now - last); last = now;
  if (playing) {
    t += dt;
    const sc = SCENES[idx];
    while (pi < sc.steps.length && sc.steps[pi][0] <= t) sc.steps[pi++][1]();
    tweens = tweens.filter(f => f());
    if (t >= sc.dur) {
      if (idx < SCENES.length - 1) goto(idx + 1);
      else { t = sc.dur; setPlaying(false); }
    }
  }
  prog.style.width = (startOf(idx) + Math.min(t, SCENES[idx].dur)) / TOTAL * 100 + "%";
  requestAnimationFrame(tick);
}

function fit() {
  const W = innerWidth, H = innerHeight - 64, k = Math.min(W / 1280, H / 720);
  stage.style.transform = `translate(${(W - 1280 * k) / 2}px, ${(H - 720 * k) / 2}px) scale(${k})`;
}

playBtn.onclick = () => setPlaying(!playing);
document.getElementById("b-restart").onclick = () => { goto(0); setPlaying(true); };
addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.code === "ArrowRight" && idx < SCENES.length - 1) { goto(idx + 1); setPlaying(true); }
  if (e.code === "ArrowLeft" && idx > 0) { goto(idx - 1); setPlaying(true); }
});

fit();
goto(0);
setPlaying(true);
requestAnimationFrame(n => { last = n; tick(n); });
</script>
</body>
</html>
